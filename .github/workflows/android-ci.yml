name: Android CI

# Runs the JVM unit tests on every push; a branch push shows as a check on its PR. The build needs
# the Android SDK, the Google Maven repo, and a JDK 25 toolchain (pinned in
# gradle/gradle-daemon-jvm.properties) — all available on a GitHub runner, none reachable from the
# Claude Code web sandbox, which is why these run here. (pull_request is intentionally omitted: with
# the workflow not yet on the base branch it did not fire, and it only duplicated the push run.)
on:
  push:

# One run per branch: a new commit cancels the superseded in-progress run instead of piling up.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on its own rather than as a step in unit-tests, for two reasons: it needs nothing but
  # Python, so it answers in seconds instead of waiting on a Gradle build, and a red check that
  # says "Layout audit" is one somebody can act on without opening the log.
  layout-audit:
    name: Layout audit (no unguarded text rows)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Three text-collision defects shipped in one week before this existed -- an ARFCN
      # overflowing its field, the map strip clipping "PCI", and a verdict headline wrapping into
      # its own marker. Each was found by a person noticing it on a screen. The script exits
      # non-zero when a row holds two or more texts with no width discipline, which makes the
      # fourth one a failed check rather than a field report.
      - name: Check for rows that can clip their own text
        run: python3 tools/layout_audit.py

  unit-tests:
    name: Unit tests (testDebugUnitTest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JDK 25 matches the daemon toolchain, so Gradle uses this JVM directly and never needs to
      # provision one from foojay.
      # v4 is deprecated and receives no further updates; v6 is the current major. v6.0.0
      # migrated the Zulu distribution to Azul's metadata API, which does not affect us -- the
      # toolchain below is temurin -- and it moved the action off Node 20.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # v3 installs the legacy `tools` SDK package, which Google has removed from the
      # repository -- sdkmanager exits 1 on "Failed to find package 'tools'" and the job dies
      # before Gradle is ever invoked, so the unit tests were silently skipped rather than run.
      # v4.0.2 fixes exactly that; v4.0.0 also moved the action to Node 24.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

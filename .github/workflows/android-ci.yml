name: Android CI

# Runs the JVM unit tests on every push; a branch push shows as a check on its PR. The build needs
# the Android SDK, the Google Maven repo, and a JDK 25 toolchain (pinned in
# gradle/gradle-daemon-jvm.properties) — all available on a GitHub runner, none reachable from the
# Claude Code web sandbox, which is why these run here. (pull_request is intentionally omitted: with
# the workflow not yet on the base branch it did not fire, and it only duplicated the push run.)
on:
  push:

# One run per branch: a new commit cancels the superseded in-progress run instead of piling up.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (testDebugUnitTest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JDK 25 matches the daemon toolchain, so Gradle uses this JVM directly and never needs to
      # provision one from foojay.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
